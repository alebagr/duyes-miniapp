<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Du&Yes Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f4f4f6; margin: 0; padding: 16px; color: #333; }
        .card { background: #fff; border-radius: 20px; padding: 20px; max-width: 400px; margin: 10px auto; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
        h2 { text-align: center; color: #ff4b72; margin-top: 0; }
        label { display: block; margin: 12px 0 6px 0; font-weight: 600; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 15px; outline: none; }
        button { width: 100%; margin-top: 20px; padding: 14px; background: #ff4b72; color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-row { display: flex; gap: 10px; }
        .gender-btn { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; font-weight: bold; cursor: pointer; }
        .error { background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <!-- ЭКРАН РЕГИСТРАЦИИ -->
    <div id="screen-register" class="card">
        <h2>📝 Регистрация анкеты</h2>
        <div id="reg-step-title" style="text-align:center; font-size:13px; color:#888; margin-bottom:15px;">Шаг 1 из 5</div>
        <div id="reg-error" class="error"></div>

        <!-- Шаг 1 -->
        <div class="reg-step" data-step="1">
            <label>Укажите ваш пол:</label>
            <div class="btn-row">
                <button type="button" class="gender-btn" onclick="selectGender('male', this)" style="background:#ff4b72; color:#fff;">👨 Мужчина</button>
                <button type="button" class="gender-btn" onclick="selectGender('female', this)">👩 Женщина</button>
            </div>
        </div>

        <!-- Шаг 2 -->
        <div class="reg-step" data-step="2" style="display:none;">
            <label>Ваше имя:</label>
            <input type="text" id="reg-name" maxlength="10" placeholder="Например, Анна">
            <label>Дата рождения (ДД.ММ.ГГГГ):</label>
            <input type="text" id="reg-birth" placeholder="15.05.1995">
            <small style="color:#666; font-size:12px;">Возраст: строго от 18 до 72 лет.</small>
        </div>

        <!-- Шаг 3 -->
        <div class="reg-step" data-step="3" style="display:none;">
            <label>Состояли ли ранее в браке?</label>
            <select id="reg-married">
                <option value="no">Нет</option>
                <option value="yes">Да</option>
            </select>
            <label>Есть ли у вас дети?</label>
            <select id="reg-children">
                <option value="no">Нет</option>
                <option value="yes">Да</option>
            </select>
        </div>

        <!-- Шаг 4 -->
        <div class="reg-step" data-step="4" style="display:none;">
            <label>Расскажите немного о себе:</label>
            <textarea id="reg-about" rows="4" placeholder="Ваши интересы и увлечения..."></textarea>
        </div>

        <!-- Шаг 5 -->
        <div class="reg-step" data-step="5" style="display:none;">
            <p style="font-size:13px; color:#555;">📷 Загрузите **две фотографии** для проверки подлинности:</p>
            <label>Фотография 1:</label>
            <input type="file" id="photo1" accept="image/*">
            <label>Фотография 2:</label>
            <input type="file" id="photo2" accept="image/*">
        </div>

        <button id="reg-next-btn" onclick="nextRegStep()">Далее →</button>
    </div>

    <!-- ЭКРАН ЛЕНТЫ АНКЕТ (скрыт до завершения регистрации) -->
    <div id="screen-feed" class="card" style="display:none; padding:0; overflow:hidden;">
        <img id="feed-photo" src="" alt="Фото" style="width:100%; height:360px; object-fit:cover;">
        <div style="padding: 20px;">
            <h2 id="feed-name-age" style="text-align:left; margin:0 0 6px 0;"></h2>
            <p id="feed-location" style="margin:0 0 12px 0; font-weight:600; color:#555;"></p>
            <p id="feed-about" style="margin:0; color:#444; line-height:1.4;"></p>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
                <button onclick="feedAction('favorite')" id="feed-fav-btn" style="margin:0; background:#f5f5f7; color:#333;">⭐ В избранное</button>
                <button onclick="alert('Чат открывается')" style="margin:0; background:#e8f5e9; color:#2e7d32;">💬 Написать</button>
                <button onclick="feedAction('block')" style="margin:0; background:#ffebee; color:#c62828;">🚫 Блок</button>
                <button onclick="feedAction('report')" style="margin:0; background:#fff8e1; color:#f57f17;">⚠️ Жалоба</button>
            </div>
            <button onclick="nextProfile()" style="margin-top: 12px; background:#ff4b72;">➡️ Следующая анкета</button>
        </div>
    </div>

<script>
let tg = window.Telegram?.WebApp;
if (tg) tg.expand();

let regData = { gender: 'male', countryCode: 'AM', country: 'Армения', city: 'Ереван' };
let currentRegStep = 1;

function selectGender(g, btn) {
    regData.gender = g;
    document.querySelectorAll('.gender-btn').forEach(b => { b.style.background = '#f9f9f9'; b.style.color = '#333'; });
    btn.style.background = '#ff4b72';
    btn.style.color = '#fff';
}

function validateAge(dateStr) {
    const parts = dateStr.includes('.') ? dateStr.split('.') : dateStr.split('-');
    if (parts.length !== 3) return false;
    const [day, month, year] = dateStr.includes('.') ? parts.map(Number) : [parts[2], parts[1], parts[0]].map(Number);
    const birthDate = new Date(year, month - 1, day);
    const today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
    return age >= 18 && age <= 72;
}

function nextRegStep() {
    const errBox = document.getElementById('reg-error');
    errBox.style.display = 'none';

    if (currentRegStep === 2) {
        regData.firstName = document.getElementById('reg-name').value.trim();
        regData.birthDate = document.getElementById('reg-birth').value.trim();
        if (!regData.firstName) { errBox.innerText = "Введите ваше имя"; errBox.style.display = 'block'; return; }
        if (!validateAge(regData.birthDate)) { errBox.innerText = "Возраст должен быть от 18 до 72 лет (ДД.ММ.ГГГГ)"; errBox.style.display = 'block'; return; }
    }
    if (currentRegStep === 3) {
        regData.married = document.getElementById('reg-married').value;
        regData.children = document.getElementById('reg-children').value;
    }
    if (currentRegStep === 4) {
        regData.about = document.getElementById('reg-about').value;
    }

    if (currentRegStep < 5) {
        document.querySelector(`[data-step="${currentRegStep}"]`).style.display = 'none';
        currentRegStep++;
        document.querySelector(`[data-step="${currentRegStep}"]`).style.display = 'block';
        document.getElementById('reg-step-title').innerText = `Шаг ${currentRegStep} из 5`;
        if (currentRegStep === 5) document.getElementById('reg-next-btn').innerText = "Завершить регистрацию";
    } else {
        submitRegistration();
    }
}

async function submitRegistration() {
    const p1 = document.getElementById('photo1').files[0];
    const p2 = document.getElementById('photo2').files[0];
    const errBox = document.getElementById('reg-error');

    if (!p1 || !p2) {
        errBox.innerText = "Загрузите обе фотографии для проверки";
        errBox.style.display = 'block';
        return;
    }

    const formData = new FormData();
    for (let key in regData) formData.append(key, regData[key]);
    formData.append('photo_1', p1);
    formData.append('photo_2', p2);

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'X-Telegram-Init-Data': tg?.initData || '' },
            body: formData
        });
        const data = await res.json();
        if (!res.ok) {
            errBox.innerText = data.detail || "Ошибка регистрации";
            errBox.style.display = 'block';
            return;
        }
        // Переходим к ленте анкет
        document.getElementById('screen-register').style.display = 'none';
        document.getElementById('screen-feed').style.display = 'block';
        loadFeed();
    } catch (e) {
        errBox.innerText = "Ошибка соединения с сервером";
        errBox.style.display = 'block';
    }
}

let feedProfiles = [];
let feedIndex = 0;

async function loadFeed() {
    try {
        const res = await fetch('/api/search/feed', {
            headers: { 'X-Telegram-Init-Data': tg?.initData || '' }
        });
        const data = await res.json();
        feedProfiles = data.profiles || [];
        renderFeedProfile();
    } catch (e) {
        console.error("Ошибка загрузки ленты", e);
    }
}

function renderFeedProfile() {
    if (feedIndex >= feedProfiles.length) {
        document.getElementById('screen-feed').innerHTML = "<h2 style='text-align:center; padding:40px;'>✨ Больше анкет нет</h2>";
        return;
    }
    const p = feedProfiles[feedIndex];
    document.getElementById('feed-photo').src = p.photo;
    document.getElementById('feed-name-age').innerText = `${p.first_name}, ${p.age}`;
    document.getElementById('feed-location').innerText = `📍 ${p.location}`;
    document.getElementById('feed-about').innerText = p.about || 'Без описания';
}

async function feedAction(action) {
    if (feedIndex >= feedProfiles.length) return;
    const targetId = feedProfiles[feedIndex].id;
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

    await fetch('/api/search/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg?.initData || '' },
        body: JSON.stringify({ target_user_id: targetId, action: action })
    });

    if (action === 'block') nextProfile();
    if (action === 'favorite') {
        const btn = document.getElementById('feed-fav-btn');
        btn.style.background = '#fff3f5';
        btn.style.color = '#ff4b72';
        btn.innerText = '⭐ В избранном';
    }
}

function nextProfile() {
    feedIndex++;
    renderFeedProfile();
}
</script>
</body>
</html>
